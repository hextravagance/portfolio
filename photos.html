<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH+T+S</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon-light.svg">
    <meta name="description" content="Photographies de Nicolas : archives photo du portfolio.">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preload" href="fonts/OffBit-Dot.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="project.css">
    <link rel="stylesheet" href="photos.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Flip.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/EasePack.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
    <script defer src="i18n.js"></script>
    <script defer src="photos-page.js"></script>
</head>

<body class="photos-page">
    <script>
        // thème choisi sur l'index (clair/sombre), appliqué avant le premier rendu
        try {
            if (localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light-theme');
                document.documentElement.classList.add('light-theme-html');
            }
        } catch (_) { }
    </script>

    <div id="custom-cursor"></div>
    <div id="page-fade" style="opacity:1"></div>

    <header class="ph-header">
        <a href="index.html" class="ph-link" id="back-top">← INDEX</a>
        <span class="ph-count" id="ph-count"></span>
    </header>

    <!-- 1. BENTO épinglé : au scroll, il s'étire jusqu'à remplir l'écran -->
    <section class="gallery-wrap">
        <div class="gallery gallery--bento" id="gallery"></div>
        <h1 class="ph-title" id="ph-title">PHOTOS</h1>
        <div class="ph-hint" id="ph-hint">SCROLL ↓</div>
    </section>

    <!-- 2. Le reste des photos, qui entrent en cascade au scroll -->
    <section class="ph-rest">
        <div class="header-section">
            <h2 class="glitch-text">ARCHIVES PHOTO</h2>
            <div class="line"></div>
        </div>
        <div class="ph-grid" id="ph-grid"></div>
        <a href="index.html" class="ph-link ph-back" id="back-bottom">← RETOUR À L'INDEX</a>
    </section>

</body>

</html>
